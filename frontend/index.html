<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral Secure Vault</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 { margin-top: 0; font-size: 1.75rem; color: var(--text); }
        p.subtitle { color: var(--text-muted); margin-bottom: 2rem; }
        .section { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #334155; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        
        /* Updated to include password inputs */
        input[type="file"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: var(--text);
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        .result-box {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
            border: 1px solid #334155;
        }
        .success { color: var(--success); font-weight: bold; margin-bottom: 0.5rem; }
        .error { color: var(--danger); margin-top: 1rem; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Burn-After-Reading Vault</h1>
        <p class="subtitle">End-to-end encrypted file sharing. Files self-destruct after download.</p>

        <!-- Upload Section -->
        <div class="section">
            <h2>Upload & Encrypt</h2>
            
            <!-- NEW: API Key Input -->
            <input type="password" id="apiKeyInput" placeholder="Enter API Key">
            
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Secure & Upload</button>
            
            <div id="uploadResult" style="display:none;" class="result-box">
                <div class="success">✓ File Secured Successfully</div>
                <div style="margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between;">
                    <div><strong>File ID:</strong> <span id="resFileId"></span></div>
                    <button onclick="copyToClipboard('resFileId', this)" style="padding: 0.3rem 0.6rem; width: auto; font-size: 0.75rem; margin: 0;">Copy</button>
                </div>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div><strong>Decryption Key:</strong> <span id="resKey"></span></div>
                    <button onclick="copyToClipboard('resKey', this)" style="padding: 0.3rem 0.6rem; width: auto; font-size: 0.75rem; margin: 0;">Copy</button>
                </div>
            </div>
        </div>

        <!-- Download Section -->
        <div class="section">
            <h2>Download & Decrypt</h2>
            <label for="downloadFileId">File ID</label>
            <input type="text" id="downloadFileId" placeholder="Enter file UUID">
            
            <label for="downloadKey">Decryption Key</label>
            <input type="text" id="downloadKey" placeholder="Enter secret Fernet key">
            
            <button onclick="downloadFile()">Retrieve & Destroy</button>
            <div id="errorMessage" class="error"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://127.0.0.1:8443";


        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            const apiKey = document.getElementById("apiKeyInput").value.trim(); // Grab the API Key
            const uploadResult = document.getElementById("uploadResult");
            const resFileId = document.getElementById("resFileId");
            const resKey = document.getElementById("resKey");
            const uploadBtn = document.querySelector("button[onclick^='uploadFile']");

            if (fileInput.files.length === 0) {
                alert("Please select a file first!");
                return;
            }

            if (!apiKey) {
                alert("Please enter the API Key to upload.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            // Disable button and show loading state
            const originalText = uploadBtn.innerText;
            uploadBtn.disabled = true;
            uploadBtn.innerText = "Encrypting & Uploading...";

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: "POST",
                    headers: {
                        'X-API-Key': apiKey  // Send the API Key in headers
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Upload failed (Check your API Key)");
                }

                const data = await response.json();
                resFileId.textContent = data.file_id;
                resKey.textContent = data.decryption_key;
                uploadResult.style.display = "block";
                
                fileInput.value = ""; 

            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                // Restore button state
                uploadBtn.disabled = false;
                uploadBtn.innerText = originalText;
            }
        }

        async function downloadFile() {
            const fileId = document.getElementById("downloadFileId").value.trim();
            const key = document.getElementById("downloadKey").value.trim();
            const errorDiv = document.getElementById("errorMessage");
            const downloadBtn = document.querySelector("button[onclick^='downloadFile']");
            errorDiv.textContent = "";

            if (!fileId || !key) {
                errorDiv.textContent = "Please enter both the File ID and Decryption Key.";
                return;
            }

            // Disable button and show loading state
            const originalText = downloadBtn.innerText;
            downloadBtn.disabled = true;
            downloadBtn.innerText = "Decrypting & Burning...";

            try {
                const response = await fetch(`${API_BASE}/download/${fileId}?decryption_key=${encodeURIComponent(key)}`, {
                    method: "POST"
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Download failed");
                }

                const disposition = response.headers.get("Content-Disposition");
                let filename = "downloaded_file";
                if (disposition && disposition.includes("filename=")) {
                    filename = disposition.split("filename=")[1].replace(/"/g, '');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                document.getElementById("downloadFileId").value = "";
                document.getElementById("downloadKey").value = "";

            } catch (err) {
                errorDiv.textContent = `Error: ${err.message}`;
            } finally {
                // Restore button state
                downloadBtn.disabled = false;
                downloadBtn.innerText = originalText;
            }
        }

        // Updated with double-click lock
        function copyToClipboard(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btnElement.innerText = "Copied!";
                btnElement.style.background = "#22c55e"; 
                btnElement.disabled = true; // Lock button to prevent double-click bug
                
                setTimeout(() => {
                    btnElement.innerText = "Copy"; // Hardcode reset
                    btnElement.style.background = ""; 
                    btnElement.disabled = false; // Unlock button
                }, 1500);
            }).catch(err => {
                alert("Failed to copy to clipboard.");
            });
        }
    </script>
</body>
</html>
