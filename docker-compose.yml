version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - VAULT_API_KEY=secure-vault-2026
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/secure_vault.db:/app/secure_vault.db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend


      